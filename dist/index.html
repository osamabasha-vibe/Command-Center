<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<style>

/* ===== 00-tokens.css ===== */
:root{
  --bg:#0d0d0f;--s1:#161619;--s2:#1e1e23;--s3:#2a2a31;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);--bd3:rgba(255,255,255,.28);
  --t:#f2f1ea;--t2:#83838f;--t3:#4d4d58;
  --nx:#4a9eff;--nx-bg:rgba(74,158,255,.11);--nx-bd:rgba(74,158,255,.5);
  --dn:#22a878;--am:#d48d1a;--rd:#e05252;--r:9px;--shadow:none;
}
body.light{
  --bg:#eeece6;--s1:#ffffff;--s2:#f4f2ec;--s3:#e6e3da;
  --bd:rgba(30,30,40,.13);--bd2:rgba(30,30,40,.22);--bd3:rgba(30,30,40,.42);
  --t:#191918;--t2:#565660;--t3:#8a8a94;
  --nx:#155fc0;--nx-bg:rgba(21,95,192,.08);--nx-bd:rgba(21,95,192,.5);
  --dn:#0c7a52;--am:#996008;--rd:#bb2f2f;
  --shadow:0 1px 3px rgba(20,20,30,.08),0 1px 2px rgba(20,20,30,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;overflow:hidden;}
.app{display:grid;grid-template-columns:210px 1fr;height:100vh;}
[contenteditable]{outline:none;}
[contenteditable]:empty:before{content:attr(data-ph);color:var(--t3);}

/* ===== 10-sidebar.css ===== */
/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.sb-scroll{flex:1;overflow-y:auto;padding-bottom:14px;}
.sb-scroll.trash{background:rgba(224,82,82,.08);}
.sb-sec{padding:10px 10px 5px;}
.sb-sec.bt{border-top:1px solid var(--bd);margin-top:6px;padding-top:10px;}
.sb-t{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;padding:0 4px 6px;}
.sb-t .plus{margin-left:auto;font-size:14px;color:var(--t3);background:none;border:none;cursor:pointer;line-height:1;padding:0 2px;}
.sb-t .plus:hover{color:var(--t);}
.corow,.pjrow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:grab;border:1px solid transparent;transition:.12s;margin:0 4px 1px;user-select:none;}
.corow:hover,.pjrow:hover{background:var(--s2);}
.corow:hover .co-x,.pjrow:hover .co-x,.pch:hover .co-x{opacity:1;}
.corow.over,.pjrow.over,.pch.over{background:var(--nx-bg);border-color:var(--nx-bd);}
.corow.drg,.pjrow.drg{opacity:.3;}
.co-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.pj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.co-nm{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:4px;padding:0 3px;margin:0 -3px;}
.co-nm:focus{border-color:var(--nx-bd);background:var(--s2);}
.pj-nm{font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2);}
.co-ct{font-size:9px;color:var(--t3);}
.co-x{font-size:12px;color:var(--t3);cursor:pointer;opacity:0;transition:.12s;line-height:1;}
.co-x:hover{color:var(--rd);}
.sb-search{padding:0 10px 7px;}
.sb-search input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--t);font-size:11px;padding:4px 9px;outline:none;font-family:inherit;}
.pch{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;cursor:grab;border:1px solid transparent;transition:.12s;user-select:none;margin:0 4px 1px;}
.pch:hover{background:var(--s2);}
.pch.drg{opacity:.28;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;width:22px;height:22px;font-size:8px;position:relative;}
.heat{position:absolute;top:-4px;right:-5px;min-width:13px;height:13px;border-radius:7px;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;color:#fff;}
.ci{flex:1;min-width:0;}
.cn{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:4px;padding:0 3px;margin:0 -3px;}
.cn:focus{border-color:var(--nx-bd);background:var(--s2);}
.cr{font-size:9px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 20-shell.css ===== */
/* MAIN */
.mn{display:flex;flex-direction:column;overflow:hidden;}
.nav{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--s1);}
.brand{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;}
.brand b{color:var(--t);}
.sep{width:1px;height:15px;background:var(--bd2);}
.nb{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid transparent;color:var(--t2);background:transparent;cursor:pointer;}
.nb:hover{color:var(--t);border-color:var(--bd2);}
.nb.on{color:var(--t);border-color:var(--bd3);background:var(--s2);}
.right{margin-left:auto;display:flex;align-items:center;gap:7px;}
.seg{display:flex;border:1px solid var(--bd2);border-radius:20px;overflow:hidden;}
.seg button{font-size:10px;font-weight:600;padding:4px 12px;border:none;background:transparent;color:var(--t2);cursor:pointer;}
.seg button.on{background:var(--s3);color:var(--t);}
.icobtn{width:27px;height:27px;border-radius:50%;border:1px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.icobtn:hover{color:var(--t);border-color:var(--bd3);}
.ct{flex:1;overflow:auto;}
.vw{display:none;}.vw.on{display:block;}

/* ===== 30-board.css ===== */
/* BOARD */
.board{padding:14px 18px 40px;display:flex;flex-direction:column;gap:18px;max-width:1700px;}
.sec{border-radius:13px;padding:2px;transition:.15s;}
.sec.over{background:var(--s2);outline:1.5px dashed var(--bd3);outline-offset:-2px;}
.sec-h{display:flex;align-items:center;gap:7px;padding:2px 6px 8px;}
.sec-dot{width:8px;height:8px;border-radius:50%;}
.sec-n{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;}
.sec-c{font-size:10px;color:var(--t3);}
.sec-add{font-size:15px;color:var(--t3);background:none;border:none;cursor:pointer;line-height:1;padding:0 4px;}
.sec-add:hover{color:var(--t);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:11px;align-items:start;}

/* FLIP CARD */
.flip{perspective:1400px;}
.flip-in{position:relative;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flip.on .flip-in{transform:rotateY(180deg);}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;}

/* BOX */
.box{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .13s;cursor:grab;box-shadow:var(--shadow);}
body.dragging .box,body.dragging .corow,body.dragging .pjrow,body.dragging .pch,body.dragging .flip-in{transition:none!important;}
body.dragging .box:hover{border-color:var(--bd);}
.box:hover{border-color:var(--bd2);}
.box.drg{opacity:.32;}
.box.nestover{border-color:var(--nx-bd);box-shadow:0 0 0 2px var(--nx-bd) inset;}
.box.insL{box-shadow:-3px 0 0 var(--nx) ;}
.box.insR{box-shadow:3px 0 0 var(--nx);}
.box.paused{opacity:.74;}
.box.killed{opacity:.46;}
.box.killed .bx-name{text-decoration:line-through;}
.bx-bar{height:2px;}
.bx-top{padding:9px 12px 7px;display:flex;align-items:flex-start;gap:8px;}
.bx-acc{width:3px;border-radius:2px;align-self:stretch;min-height:26px;flex-shrink:0;}
.pri{font-size:9px;font-weight:700;color:var(--t3);background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:1px 5px;flex-shrink:0;margin-top:1px;}
.bx-mid{flex:1;min-width:0;}
.bx-name{font-size:14px;font-weight:600;line-height:1.28;border:1px solid transparent;border-radius:5px;padding:1px 4px;margin:-1px -4px 3px;}
.bx-name:hover{border-color:var(--bd2);}
.bx-name:focus{border-color:var(--nx-bd);background:var(--s2);}
.co-pick{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:2px 7px;outline:none;font-family:inherit;cursor:pointer;max-width:150px;}
.co-pick:focus{border-color:var(--nx-bd);}
.ico{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;line-height:1;padding:2px 3px;flex-shrink:0;}
.ico:hover{color:var(--t);}
.ico.del:hover{color:var(--rd);}
.bx-ppl{padding:0 12px 7px;}
.pdrop{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:3px 6px;border-radius:20px;border:1px dashed var(--bd);min-height:26px;transition:.12s;}
.pdrop.over{border-color:var(--nx-bd);background:var(--nx-bg);}
.pav{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;cursor:grab;}
.pav:hover{transform:scale(1.12);}
.pp-h{font-size:9px;color:var(--t3);padding:0 3px;}
.bx-goals{padding:2px 12px 4px;display:flex;flex-direction:column;gap:9px;}
.gblk{border-top:1px solid var(--bd);padding-top:8px;}
.gblk:first-child{border-top:none;padding-top:0;}
.g-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px;}
.g-l{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;flex-shrink:0;margin-top:3px;}
.g-t{font-size:12px;color:var(--t2);line-height:1.4;flex:1;border:1px solid transparent;border-radius:5px;padding:1px 5px;margin:-1px -5px;}
.g-t:hover{border-color:var(--bd2);}
.g-t:focus{border-color:var(--nx-bd);background:var(--s2);color:var(--t);}
.g-del{font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;opacity:0;flex-shrink:0;}
.gblk:hover .g-del{opacity:1;}
.g-del:hover{color:var(--rd);}
.bx-act{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px;}
.bx-act::-webkit-scrollbar{height:4px;}
.bx-act::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:2px;}
.chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);color:var(--t2);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;position:relative;}
.chip.dn{opacity:.5;}
.chip.dn .chip-tx{text-decoration:line-through;}
.chip.nx{border-color:var(--nx-bd);background:var(--nx-bg);color:var(--nx);font-weight:500;cursor:grab;}
.chip-cb{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--bd3);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;flex-shrink:0;}
.chip.nx .chip-cb{border-color:var(--nx-bd);}
.chip-cb:checked{background:var(--dn);border-color:var(--dn);}
.chip-x{font-size:11px;color:var(--t3);cursor:pointer;opacity:0;margin-left:1px;}
.chip:hover .chip-x{opacity:1;}
.chip-x:hover{color:var(--rd);}
.arr{color:var(--t3);font-size:11px;padding:0 5px;flex-shrink:0;}
.arr.nx{color:var(--nx);}
.act-in{flex:1;min-width:95px;background:transparent;border:none;color:var(--t);font-size:11px;padding:4px 8px;outline:none;font-family:inherit;flex-shrink:0;}
.act-in::placeholder{color:var(--t3);}
.act-in:focus{background:var(--s2);border-radius:20px;}
.bx-foot{display:flex;align-items:center;gap:6px;padding:5px 12px 9px;}
.tinybtn{font-size:10px;color:var(--t3);background:none;border:1px dashed var(--bd2);border-radius:20px;padding:2px 9px;cursor:pointer;}
.tinybtn:hover{color:var(--t);border-color:var(--bd3);}
.nestzone{margin:0 12px 10px;border:1px dashed var(--bd);border-radius:8px;padding:4px 8px;font-size:8.5px;color:var(--t3);text-align:center;transition:.12s;}
.nestzone.over{border-color:var(--nx-bd);background:var(--nx-bg);color:var(--nx);}

/* BACK / IDEAS */
.back-box{background:var(--s1);border:1px solid var(--bd2);border-radius:12px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
.bk-h{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);}
.bk-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);flex:1;}
.bk-b{flex:1;overflow-y:auto;padding:9px 12px;display:flex;flex-direction:column;gap:5px;}
.idea{display:flex;align-items:flex-start;gap:7px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;}
.idea-t{font-size:11.5px;flex:1;line-height:1.35;border:1px solid transparent;border-radius:4px;padding:0 3px;margin:0 -3px;}
.idea-t:focus{border-color:var(--nx-bd);background:var(--s1);}
.idea-a{display:flex;gap:3px;flex-shrink:0;}
.ib{font-size:9px;padding:2px 7px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--t3);cursor:pointer;white-space:nowrap;}
.ib:hover{color:var(--t);border-color:var(--bd3);}
.ib.x:hover{color:var(--rd);border-color:var(--rd);}
.bk-add{padding:8px 12px 11px;border-top:1px solid var(--bd);}
.bk-add input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:20px;color:var(--t);font-size:11px;padding:6px 11px;outline:none;font-family:inherit;}
.bk-add input:focus{border-color:var(--nx-bd);}
.bk-empty{font-size:11px;color:var(--t3);padding:10px 2px;}

/* ===== 40-focus.css ===== */
/* FOCUS */
.focus{padding:18px 20px 40px;max-width:760px;}
.f-h{font-size:15px;font-weight:600;margin-bottom:2px;}
.f-sub{font-size:11px;color:var(--t2);margin-bottom:16px;}
.f-row{display:flex;align-items:center;gap:11px;background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);}
.f-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--nx-bd);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;flex-shrink:0;}
.f-cb:checked{background:var(--dn);border-color:var(--dn);}
.f-mid{flex:1;min-width:0;}
.f-act{font-size:13px;font-weight:500;}
.f-meta{font-size:10px;color:var(--t2);margin-top:1px;display:flex;align-items:center;gap:5px;}
.f-meta .co-dot{width:6px;height:6px;}
.f-who{font-size:10px;color:var(--t3);flex-shrink:0;}
.f-open{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;flex-shrink:0;}
.f-empty{color:var(--t3);font-size:12px;padding:20px 0;}

/* ===== 50-people.css ===== */
/* PEOPLE TASK LIST */
.pv{padding:16px 18px 40px;}
.pv-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.pv-t{font-size:15px;font-weight:600;}
.pv-sub{font-size:11px;color:var(--t2);margin-bottom:14px;}
.pv-filters{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;align-items:center;}
.pv-filters select{background:var(--s2);border:1px solid var(--bd2);border-radius:20px;color:var(--t);font-size:11px;padding:4px 9px;outline:none;font-family:inherit;cursor:pointer;}
.pv-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start;}
.pcol{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.pcol-h{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--bd);}
.pcol-av{width:30px;height:30px;font-size:10px;}
.pcol-n{font-size:13px;font-weight:600;}
.pcol-r{font-size:10px;color:var(--t2);}
.pcol-ct{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.pcol-b{padding:7px 9px 10px;display:flex;flex-direction:column;gap:4px;min-height:38px;}
.pcol-b.over{background:var(--nx-bg);}
.ptask{display:flex;align-items:flex-start;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;cursor:grab;transition:border-color .12s;}
.ptask:hover{border-color:var(--bd2);}
.ptask.drg{opacity:.3;}
.ptask.ins{box-shadow:0 -2px 0 var(--nx);}
.ptask.done{opacity:.45;}
.pt-rank{font-size:9px;font-weight:700;color:var(--t3);min-width:13px;margin-top:2px;}
.pt-cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--bd3);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;flex-shrink:0;margin-top:2px;}
.pt-cb:checked{background:var(--dn);border-color:var(--dn);}
.pt-mid{flex:1;min-width:0;}
.pt-t{font-size:11.5px;line-height:1.35;border:1px solid transparent;border-radius:4px;padding:0 3px;margin:0 -3px;}
.pt-t:focus{border-color:var(--nx-bd);background:var(--s1);}
.pt-t.done{text-decoration:line-through;color:var(--t3);}
.pt-meta{font-size:9px;color:var(--t3);margin-top:2px;display:flex;align-items:center;gap:4px;}
.pt-meta .co-dot{width:5px;height:5px;}
.pt-open{font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;flex-shrink:0;}
.pt-open:hover{color:var(--t);}
.pcol-e{font-size:10.5px;color:var(--t3);padding:6px 4px;}
.pcol-add{padding:0 9px 10px;}
.pcol-add input{width:100%;background:transparent;border:1px dashed var(--bd2);border-radius:20px;color:var(--t);font-size:11px;padding:5px 10px;outline:none;font-family:inherit;}
.pcol-add input:focus{border-color:var(--nx-bd);background:var(--s2);}


.pv-search{position:relative;}
.pv-search input{background:var(--s2);border:1px solid var(--bd2);border-radius:20px;color:var(--t);font-size:11px;padding:4px 11px;outline:none;font-family:inherit;width:150px;}
.pv-search input:focus{border-color:var(--nx-bd);width:190px;}
.pcol.drg{opacity:.32;}
.pcol.insL{box-shadow:-3px 0 0 var(--nx);}
.pcol.insR{box-shadow:3px 0 0 var(--nx);}
.pcol-h{cursor:grab;}
.pcol-h:active{cursor:grabbing;}
.pcol-n{cursor:pointer;}
.pcol-n:hover{text-decoration:underline;}
.pv-focus{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd2);border-radius:20px;padding:4px 6px 4px 5px;font-size:11px;}
.pv-focus button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;line-height:1;}
.pv-focus button:hover{color:var(--t);}
.pv-cols.solo{grid-template-columns:minmax(0,720px);}
.pri-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;cursor:pointer;border:1.5px solid var(--bd3);background:transparent;padding:0;}
.pri-dot.h{background:var(--rd);border-color:var(--rd);}
.pri-dot.m{background:var(--am);border-color:var(--am);}
.pri-dot.l{background:var(--dn);border-color:var(--dn);}
.pgrp{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--t3);padding:6px 3px 2px;display:flex;align-items:center;gap:5px;}
.pgrp .pri-dot{margin-top:0;cursor:default;}
.pt-del{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;flex-shrink:0;opacity:0;}
.ptask:hover .pt-del{opacity:1;}
.pt-del:hover{color:var(--rd);}

/* ===== 60-popup.css ===== */
/* POPUP */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:300;padding:22px;}
body.light .ov{background:rgba(40,40,50,.35);}
.ov.open{display:flex;}
.pop{background:var(--s1);border:1px solid var(--bd2);border-radius:15px;width:100%;max-width:960px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.3);}
.pop-h{padding:15px 20px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.pop-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.pop-n{font-size:19px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:-2px -6px 4px;flex:1;}
.pop-n:hover{border-color:var(--bd2);}
.pop-n:focus{border-color:var(--nx-bd);background:var(--s2);}
.pop-x{font-size:19px;color:var(--t3);cursor:pointer;background:none;border:none;line-height:1;flex-shrink:0;}
.pop-team{display:flex;flex-wrap:wrap;gap:4px;min-height:29px;padding:4px 7px;border-radius:var(--r);border:1px dashed var(--bd2);background:var(--s2);margin-top:6px;}
.pop-team.over{border-color:var(--nx-bd);background:var(--nx-bg);}
.tm{display:flex;align-items:center;gap:5px;background:var(--s1);border:1px solid var(--bd2);border-radius:20px;padding:2px 8px 2px 3px;cursor:grab;}
.tm .av{width:18px;height:18px;font-size:7px;}
.tm-n{font-size:10px;}
.tm-e{font-size:10px;color:var(--t3);align-self:center;}
.pop-b{flex:1;overflow:auto;padding:15px 20px 20px;display:flex;flex-direction:column;gap:16px;}
.pgblk{border-top:1px solid var(--bd);padding-top:13px;}
.pgblk:first-child{border-top:none;padding-top:0;}
.pgblk-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.pop-gl{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-top:5px;flex-shrink:0;}
.pop-gt{font-size:14px;font-weight:500;flex:1;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:-3px -6px;}
.pop-gt:hover{border-color:var(--bd2);}
.pop-gt:focus{border-color:var(--nx-bd);background:var(--s2);}
.pgdel{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;flex-shrink:0;margin-top:3px;}
.pgdel:hover{color:var(--rd);}
.chain{display:flex;align-items:stretch;min-width:max-content;}
.stp{width:170px;flex-shrink:0;border:1px solid var(--bd2);border-radius:var(--r);padding:10px 11px;background:var(--s2);display:flex;flex-direction:column;gap:5px;cursor:grab;}
.stp.drg{opacity:.3;}
.stp.over{border-color:var(--nx-bd);background:var(--nx-bg);}
.stp.dn{opacity:.42;}
.stp.nx{border:1.5px solid var(--nx-bd);background:var(--nx-bg);}
.st-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);}
.st-l.nx{color:var(--nx);}
.st-t{font-size:12px;font-weight:500;line-height:1.35;border:1px solid transparent;border-radius:4px;padding:1px 4px;margin:-1px -4px;}
.st-t:hover{border-color:var(--bd2);}
.st-t:focus{border-color:var(--nx-bd);background:var(--s1);}
.st-t.dn{text-decoration:line-through;color:var(--t3);}
.st-t.nx{color:var(--nx);}
.st-w{font-size:10px;color:var(--t2);border:1px solid transparent;border-radius:4px;padding:0 4px;margin:0 -4px;}
.st-w:focus{border-color:var(--nx-bd);background:var(--s1);color:var(--t);}
.st-row{display:flex;align-items:center;gap:6px;margin-top:auto;}
.scb{width:13px;height:13px;border-radius:3px;border:1px solid var(--bd2);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;flex-shrink:0;}
.scb:checked{background:var(--dn);border-color:var(--dn);}
.sdel{font-size:12px;color:var(--t3);cursor:pointer;margin-left:auto;line-height:1;}
.sdel:hover{color:var(--rd);}
.arw{display:flex;align-items:center;padding:0 6px;color:var(--t3);font-size:16px;align-self:center;flex-shrink:0;}
.arw.nx{color:var(--nx);}
.newstep{width:170px;flex-shrink:0;border:1px dashed var(--bd2);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:5px;align-self:stretch;justify-content:center;}
.newstep input{background:var(--s2);border:1px solid var(--bd2);border-radius:5px;color:var(--t);font-size:11px;padding:5px 7px;outline:none;font-family:inherit;width:100%;}
.newstep input:focus{border-color:var(--nx-bd);}
.newstep-hint{font-size:9px;color:var(--t3);}
.addgoal-pop{font-size:11px;color:var(--t2);background:none;border:1px dashed var(--bd2);border-radius:20px;padding:5px 13px;cursor:pointer;align-self:flex-start;}
.addgoal-pop:hover{color:var(--t);border-color:var(--bd3);}
.pop-hint{font-size:9px;color:var(--t3);}

    setSrvBadge('saving…','var(--am)');
    fetch('/api/data',{method:'POST',headers:ccHeaders(),body:JSON.stringify(store)})
      .then(r=>{if(r.status===401){if(askPass('Wrong or missing password. Try again:'))pushServer();throw 0;}if(!r.ok)throw 0;setSrvBadge('saved','var(--dn)');setTimeout(()=>setSrvBadge('','var(--t3)'),1400);})
      .catch(()=>setSrvBadge('offline','var(--rd)'));
  },500);
}

  try{localStorage.setItem('cc9',JSON.stringify(store));}catch(e){}
  if(SERVER){pushServer();return;}

}
async function pullServer(){
  if(!SERVER)return;
  try{
    let r=await fetch('/api/data',{cache:'no-store',headers:ccHeaders()});
    if(r.status===401){if(!askPass('Enter your Command Center password'))return;r=await fetch('/api/data',{cache:'no-store',headers:ccHeaders()});}
    if(!r.ok)throw 0;
    const d=await r.json();
    if(d&&(d.work||d.personal)){
      const w=normSpace(d.work),pe=normSpace(d.personal);
      if(w)store.work=w;
      if(pe)store.personal=pe;
      if(d.people&&d.people.length)store.people=d.people;
      ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];if(!p.goals||!p.goals.length)p.goals=[G('',[])];});});
      rAll();
      setSrvBadge('loaded','var(--dn)');setTimeout(()=>setSrvBadge('','var(--t3)'),1400);

    }

}

function dEnd(){document.body.classList.remove('dragging');document.querySelectorAll('.drg,.insL,.insR,.nestover,.over').forEach(el=>el.classList.remove('drg','insL','insR','nestover','over'));drag=null;_rect=null;_rectId=null;_side=null;}

function applyDrop(id,mode){
  if(!drag)return;
  const tgt=P(id);if(!tgt){drag=null;return;}
  if(drag.type==='person'){
    if(drag.from&&drag.from!==id){const s=P(drag.from);if(s)s.team=s.team.filter(x=>x!==drag.id);}
    if(!tgt.team.includes(drag.id))tgt.team.push(drag.id);
  } else if(drag.type==='co'){tgt.co=drag.id;}
  else if(drag.type==='act'){
    const src=P(drag.proj);
    if(src){const sg=src.goals[drag.gi];const [st]=sg.steps.splice(drag.idx,1);tgt.goals[0].steps.push(st);
      if(src.id!==tgt.id&&sg.steps.length===0&&src.goals.length>1)src.goals.splice(drag.gi,1);}
  } else if(drag.type==='proj'&&mode==='nest'&&drag.id!==id){
    const src=P(drag.id);
    if(src){src.goals.forEach(g=>tgt.goals.push(g));src.team.forEach(pid=>{if(!tgt.team.includes(pid))tgt.team.push(pid);});
      S().projects=S().projects.filter(x=>x.id!==drag.id);}
  }
  save();rAll();drag=null;
}
/* PRIORITY REORDER */
function reorderProj(fromId,toId,after){
  if(fromId===toId)return;
  const arr=S().projects;
  const fi=arr.findIndex(x=>x.id===fromId);if(fi<0)return;
  const [mv]=arr.splice(fi,1);
  const tgt=arr.find(x=>x.id===toId);
  if(tgt)mv.st=tgt.st;
  let ti=arr.findIndex(x=>x.id===toId);
  if(ti<0)ti=arr.length-1;
  arr.splice(after?ti+1:ti,0,mv);
  save();rAll();
}
let _rect=null,_rectId=null,_side=null;
function bxEnter(e,id){
  if(!drag)return;
  const el=document.getElementById('bx-'+id);if(!el)return;
  _rect=el.getBoundingClientRect();_rectId=id;_side=null;
}
function bxOver(e,id){
  if(!drag)return;
  const el=document.getElementById('bx-'+id);if(!el)return;
  if(drag.type==='proj'&&drag.id!==id){
    e.preventDefault();e.stopPropagation();
    if(_rectId!==id||!_rect){_rect=el.getBoundingClientRect();_rectId=id;}
    const after=e.clientX>_rect.left+_rect.width/2;
    if(after===_side)return;
    _side=after;
    el.classList.toggle('insR',after);el.classList.toggle('insL',!after);
  } else if(drag.type==='person'||drag.type==='co'||drag.type==='act'){
    e.preventDefault();e.stopPropagation();
    if(!el.classList.contains('nestover'))el.classList.add('nestover');
  }
}
function bxLeave(e,id){const el=document.getElementById('bx-'+id);if(el)el.classList.remove('insL','insR','nestover');if(_rectId===id){_rect=null;_rectId=null;_side=null;}}
function bxDrop(e,id){
  e.preventDefault();e.stopPropagation();
  const el=document.getElementById('bx-'+id);
  if(!drag){return;}
  if(drag.type==='proj'){
    const r=(_rectId===id&&_rect)?_rect:el.getBoundingClientRect();const after=e.clientX>r.left+r.width/2;
    const fromId=drag.id;drag=null;
    if(el)el.classList.remove('insL','insR');
    reorderProj(fromId,id,after);return;
  }
  if(el)el.classList.remove('nestover');
  applyDrop(id,'assign');
}

/* ===== 62-people-view.js ===== */
/* ═══ PEOPLE TASK LIST ═══ */
let pvCo='',pvProj='',pvDone='open',pvQ='',pvSolo='',pvSort='order';
const PRI={h:{n:'High',r:0},m:{n:'Mid',r:1},l:{n:'Low',r:2}};
function priOf(st){return st.p||'m';}
function personMatches(step,person){
  if(step.a)return step.a===person.id;
  const w=(step.w||'').trim().toLowerCase();
  if(!w||w==='—')return false;
  const full=person.name.toLowerCase(),first=full.split(' ')[0];
  return w===full||w===first||w.startsWith(first+' ')||full.startsWith(w);
}
function tasksFor(person){
  const out=[];
  const q=pvQ.toLowerCase();
  S().projects.forEach(p=>{
    if(p.st==='killed')return;
    if(pvCo&&p.co!==pvCo)return;
    if(pvProj&&p.id!==pvProj)return;
    p.goals.forEach((g,gi)=>g.steps.forEach((st,si)=>{
      if(!personMatches(st,person))return;
      if(pvDone==='open'&&st.d)return;
      if(q&&!((st.t||'').toLowerCase().includes(q)||p.name.toLowerCase().includes(q)))return;
      out.push({p,g,gi,si,st});
    }));
  });
  const ord=(store.order[person.id]||[]);
  out.sort((a,b)=>{
    const pa=PRI[priOf(a.st)].r,pb=PRI[priOf(b.st)].r;
    if(pa!==pb)return pa-pb;
    const ai=ord.indexOf(a.st.id),bi=ord.indexOf(b.st.id);
    if(ai>=0&&bi>=0)return ai-bi;
    if(ai>=0)return -1;
    if(bi>=0)return 1;
    return 0;
  });
  return out;
}
function roster(){
  if(space!=='work')return[{id:'me',name:'Osama',role:'Owner',grp:'Personal',c:'#7F77DD'}];
  let r=PPL().slice();
  const q=pvQ.toLowerCase();
  if(q)r=r.filter(x=>x.name.toLowerCase().includes(q)||(x.role||'').toLowerCase().includes(q)||tasksFor(x).length);
  const co=store.colOrder&&store.colOrder[space]?store.colOrder[space]:[];
  if(pvSort==='order'&&co.length){
    r.sort((a,b)=>{const ai=co.indexOf(a.id),bi=co.indexOf(b.id);
      if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return -1;if(bi>=0)return 1;return 0;});
  } else if(pvSort==='most'){r.sort((a,b)=>openCount(b)-openCount(a));}
  else if(pvSort==='least'){r.sort((a,b)=>openCount(a)-openCount(b));}
  else if(pvSort==='urgent'){r.sort((a,b)=>highCount(b)-highCount(a));}
  else if(pvSort==='name'){r.sort((a,b)=>a.name.localeCompare(b.name));}
  else if(pvSort==='team'){r.sort((a,b)=>(a.grp||'').localeCompare(b.grp||'')||a.name.localeCompare(b.name));}
  return r;
}
function openCount(pp){return tasksFor(pp).filter(x=>!x.st.d).length;}
function highCount(pp){return tasksFor(pp).filter(x=>!x.st.d&&priOf(x.st)==='h').length;}

function rPeople(){
  const all=roster();
  const list=pvSolo?all.filter(x=>x.id===pvSolo):all;
  const coOpts=`<option value="">All companies</option>`+S().cos.map(c=>`<option value="${c.id}"${pvCo===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
  const pjOpts=`<option value="">All projects</option>`+S().projects.filter(p=>p.st!=='killed'&&(!pvCo||p.co===pvCo)).map(p=>`<option value="${p.id}"${pvProj===p.id?' selected':''}>${esc(p.name)}</option>`).join('');
  const sorts=[['order','Manual order'],['most','Most tasks'],['least','Least tasks'],['urgent','Most high priority'],['name','Name A-Z'],['team','Team']];

  const cols=list.map(person=>{
    const t=tasksFor(person);
    const n=t.filter(x=>!x.st.d).length,hi=t.filter(x=>!x.st.d&&priOf(x.st)==='h').length;
    const hc=n>=6?'var(--rd)':n>=4?'var(--am)':n>0?'var(--dn)':'var(--t3)';
    const hbg=n>=6?'rgba(224,82,82,.13)':n>=4?'rgba(212,141,26,.13)':n>0?'rgba(34,168,120,.13)':'transparent';

    let rows='',lastP=null;
    if(t.length){
      t.forEach((x,i)=>{
        const pr=priOf(x.st);
        if(pr!==lastP&&!x.st.d){rows+=`<div class="pgrp"><span class="pri-dot ${pr}"></span>${PRI[pr].n}</div>`;lastP=pr;}
        const co=coOf(x.p.co);
        rows+=`<div class="ptask${x.st.d?' done':''}" id="pt-${person.id}-${x.st.id}" draggable="true"
          ondragstart="dsTask(event,'${person.id}','${x.st.id}')" ondragend="dEnd()"
          ondragover="ptOver(event,'${person.id}','${x.st.id}')" ondragleave="ptLeave(event,'${person.id}','${x.st.id}')" ondrop="ptDrop(event,'${person.id}','${x.st.id}')">
          <button class="pri-dot ${pr}" onclick="cyclePri('${x.st.id}')" title="Priority: ${PRI[pr].n} — click to change"></button>
          <input type="checkbox" class="pt-cb" ${x.st.d?'checked':''} onchange="tog('${x.p.id}',${x.gi},${x.si},this.checked)">
          <div class="pt-mid">
            <div class="pt-t${x.st.d?' done':''}" contenteditable spellcheck="false" onblur="editStep(event,'${x.p.id}',${x.gi},${x.si})" onkeydown="keyBlur(event)" ondragstart="event.preventDefault();event.stopPropagation()">${esc(x.st.t)}</div>
            <div class="pt-meta"><span class="co-dot" style="background:${pcol(x.p)}"></span>${esc(x.p.name)}${co?' · '+esc(co.name):''}</div>
          </div>
          <button class="pt-open" onclick="openPop('${x.p.id}')" title="Open project">⤢</button>
          <button class="pt-del" onclick="delTask('${x.p.id}',${x.gi},${x.si})" title="Delete task">×</button>
        </div>`;
      });
    } else rows=`<div class="pcol-e">${pvQ?'No tasks match that search.':'No open tasks assigned.'}</div>`;

    return`<div class="pcol" id="pcol-${person.id}" draggable="true"
      ondragstart="dsCol(event,'${person.id}')" ondragend="dEnd()"
      ondragenter="colEnter(event,'${person.id}')" ondragover="colOver(event,'${person.id}')" ondragleave="colLeave(event,'${person.id}')" ondrop="colDrop(event,'${person.id}')">
      <div class="pcol-h">

function delTask(projId,gi,si){

function findStep(stepId){
  for(const p of S().projects)for(let gi=0;gi<p.goals.length;gi++){

function applyTaskMove(stepId,fromPerson,toPerson,beforeStepId){
  const f=findStep(stepId);if(!f)return;
  const person=roster().find(x=>x.id===toPerson);
  if(person&&toPerson!==fromPerson){
    f.st.a=person.id;
    f.st.w=person.name.split(' ')[0];
    store.order[fromPerson]=(store.order[fromPerson]||[]).filter(x=>x!==stepId);
  }
  if(beforeStepId){
    const bf=findStep(beforeStepId);
    if(bf)f.st.p=priOf(bf.st);
  }
  const target=roster().find(x=>x.id===toPerson);
  if(target){
    const visible=tasksFor(target).map(x=>x.st.id).filter(x=>x!==stepId);
    let at=beforeStepId?visible.indexOf(beforeStepId):visible.length;
    if(at<0)at=visible.length;
    visible.splice(at,0,stepId);
    store.order[toPerson]=visible;
  }
  save();rAll();
}

  if(!drag||drag.type!=='col'||drag.id===personId)return;
  e.preventDefault();e.stopPropagation();
  const el=document.getElementById('pcol-'+personId);if(!el)return;
  if(_colId!==personId||!_colRect){_colRect=el.getBoundingClientRect();_colId=personId;}
  const after=e.clientX>_colRect.left+_colRect.width/2;
  if(after===_colSide)return;
  _colSide=after;
  el.classList.toggle('insR',after);el.classList.toggle('insL',!after);
}
function colLeave(e,personId){const el=document.getElementById('pcol-'+personId);if(el)el.classList.remove('insL','insR');}
function colDrop(e,personId){
  if(!drag||drag.type!=='col'){return;}
  e.preventDefault();e.stopPropagation();

  const r=(_colId===personId&&_colRect)?_colRect:(el?el.getBoundingClientRect():{left:0,width:0});
  const after=e.clientX>r.left+r.width/2;
  if(el)el.classList.remove('insL','insR');
  const fromId=drag.id;drag=null;_colRect=null;_colId=null;_colSide=null;
  if(fromId===personId)return;
  if(!store.colOrder)store.colOrder={};
  let ord=(store.colOrder[space]&&store.colOrder[space].length)?store.colOrder[space].slice():roster().map(x=>x.id);
  ord=ord.filter(x=>x!==fromId);
  let at=ord.indexOf(personId);
  if(at<0)at=ord.length; else if(after)at++;
  ord.splice(at,0,fromId);
  store.colOrder[space]=ord;
  pvSort='order';
  save();rPeople();
}
function addPersonTask(e,personId){
  if(e.key!=='Enter')return;

  if(!target)target=S().projects.find(p=>p.st==='active'&&(!pvCo||p.co===pvCo));
  if(!target){alert('Create a project first, or pick one in the project filter.');return;}
  const person=roster().find(x=>x.id===personId);

  const st={id:sid(),t:v,w:person?person.name.split(' ')[0]:'—',a:personId,p:'m',d:0};
  target.goals[gi].steps.push(st);

}

const CURKEY='cc9';
function normSpace(sp){
  if(!sp||!Array.isArray(sp.projects))return null;
  const cos=Array.isArray(sp.cos)?sp.cos.map(c=>({id:c.id||('c'+Math.random().toString(36).slice(2,7)),name:c.name||'Company',color:c.color||'#83838f'})):[];
  const byName={};cos.forEach(c=>byName[(c.name||'').toLowerCase()]=c.id);
  const projects=sp.projects.filter(p=>p&&(p.name||p.goal||p.goals||p.steps)).map(p=>{
    let goals=[];
    if(Array.isArray(p.goals)&&p.goals.length){
      goals=p.goals.map(g=>({id:g.id||('g'+Math.random().toString(36).slice(2,9)),title:g.title||g.goal||'',
        steps:(g.steps||[]).map(st=>({t:st.t||st.title||st.text||'',w:st.w||st.who||'—',d:(st.d||st.done)?1:0}))}));
    } else {
      goals=[{id:'g'+Math.random().toString(36).slice(2,9),title:p.goal||'',
        steps:(p.steps||[]).map(st=>({t:st.t||st.title||st.text||'',w:st.w||st.who||'—',d:(st.d||st.done)?1:0}))}];
    }
    let co=p.co||null;
    if(co&&!cos.find(c=>c.id===co))co=byName[String(co).toLowerCase()]||null;
    return{id:p.id||('p'+Math.random().toString(36).slice(2,9)),name:p.name||'Untitled',co,
      st:['active','paused','killed'].includes(p.st)?p.st:'active',
      team:Array.isArray(p.team)?p.team:[],ideas:Array.isArray(p.ideas)?p.ideas:[],goals};
  });
  return{cos,projects};
}
function parseAny(raw){
  let d;try{d=JSON.parse(raw);}catch(e){return null;}
  if(!d)return null;
  if(Array.isArray(d)){const w=normSpace({cos:[],projects:d});return w&&w.projects.length?{work:w,personal:null}:null;}
  if(d.work||d.personal){
    const w=normSpace(d.work),pe=normSpace(d.personal);
    if((w&&w.projects.length)||(pe&&pe.projects.length))return{work:w,personal:pe,people:d.people||null};
    return null;
  }
  if(Array.isArray(d.projects)){const w=normSpace(d);return w&&w.projects.length?{work:w,personal:null}:null;}
  return null;
}
function scanOld(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||k===CURKEY||k==='cc_light'||k==='cc_space')continue;
    const raw=localStorage.getItem(k);
    if(!raw||raw.length<40)continue;
    const d=parseAny(raw);
    if(d){d.label=k;d.size=raw.length;out.push(d);}
  }
  out.sort((a,b)=>b.size-a.size);
  return out;
}

/* ═══ LOCAL FILE STORAGE (File System Access API) ═══ */
let fileHandle=null,fileTimer=null,fileBusy=false;
const IDB_DB='cc_fs',IDB_STORE='handles';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);
  r.onupgradeneeded=()=>{r.result.createObjectStore(IDB_STORE);};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readonly');const q=t.objectStore(IDB_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

function fsSupported(){return typeof window.showSaveFilePicker==='function';}
function setFileBadge(){
  const b=document.getElementById('fileBtn');if(!b)return;
  if(fileHandle){b.style.borderColor='var(--dn)';b.style.color='var(--dn)';b.title='Saving to '+fileHandle.name+' — click to change file';}
  else{b.style.borderColor='';b.style.color='';b.title=fsSupported()?'Connect a file on your computer':'File storage needs Chrome or Edge on desktop';}
}
async function writeFile(){
  if(!fileHandle||fileBusy)return;
  fileBusy=true;
  try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(store,null,2));await w.close();}
  catch(e){console.warn('file write failed',e);}
  fileBusy=false;
}
function scheduleWrite(){if(!fileHandle)return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,600);}

async function connectFile(){
  if(!fsSupported()){
    alert('Saving to a file needs Chrome or Edge on desktop.\n\nUse ⟲ → Download backup instead, and load the file when you reopen.');
    return;
  }
  try{
    const h=await window.showSaveFilePicker({
      suggestedName:'command-center.json',
      types:[{description:'Command Center data',accept:{'application/json':['.json']}}]
    });
    let existing=null;
    try{const f=await h.getFile();const txt=await f.text();if(txt.trim())existing=parseAny(txt);}catch(e){}
    if(existing){
      if(confirm('That file already has a board in it.\n\nOK = load the file into this page.\nCancel = overwrite the file with what is on screen now.')){
        if(existing.work)store.work=existing.work;
        if(existing.personal)store.personal=existing.personal;
        if(existing.people)store.people=existing.people;
        ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];if(!p.goals||!p.goals.length)p.goals=[G('',[])];});});
      }
    }
    fileHandle=h;
    await idbSet('handle',h);
    await writeFile();
    save();rAll();setFileBadge();
    alert('Connected. Every change now saves straight to '+h.name+' on your computer.');
  }catch(e){/* user cancelled */}
}
async function tryReconnectFile(){
  if(!fsSupported())return setFileBadge();
  try{
    const h=await idbGet('handle');
    if(!h)return setFileBadge();
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      const again=await h.requestPermission({mode:'readwrite'});
      if(again!=='granted')return setFileBadge();
    }
    const f=await h.getFile();const txt=await f.text();
    const d=txt.trim()?parseAny(txt):null;
    if(d){
      if(d.work)store.work=d.work;
      if(d.personal)store.personal=d.personal;
      if(d.people)store.people=d.people;
      ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];if(!p.goals||!p.goals.length)p.goals=[G('',[])];});});
      save();rAll();
    }
    fileHandle=h;setFileBadge();
  }catch(e){setFileBadge();}
}
function renderDiag(){
  const el=document.getElementById('diag');if(!el)return;
  let out=[];
  try{
    out.push('page address: '+location.href.slice(0,90));
    out.push('mode: '+(SERVER?'local server (data.json on disk)':'browser storage'));
    out.push('file storage: '+(fileHandle?('connected → '+fileHandle.name):(fsSupported()?'available, not connected':'not supported in this browser')));
    out.push('storage entries: '+localStorage.length);
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);const v=localStorage.getItem(k)||'';
      const ok=parseAny(v)?' [readable board]':'';
      out.push('• '+k+'  —  '+v.length+' chars'+ok);
    }
    if(!localStorage.length)out.push('(storage is empty on this page address)');
  }catch(e){out.push('storage blocked: '+e.message);}
  el.innerHTML=out.map(x=>esc(x)).join('<br>');
}
function loadPasted(){
  const box=document.getElementById('pastebox');if(!box)return;
  const txt=(box.value||'').trim();
  if(!txt){alert('Nothing pasted.');return;}
  const d=parseAny(txt);
  if(!d){alert('Could not read that as board data.');return;}
  if(!confirm('Replace the current board with the pasted data?'))return;
  if(d.work)store.work=d.work;
  if(d.personal)store.personal=d.personal;
  if(d.people)store.people=d.people;
  ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];if(!p.goals||!p.goals.length)p.goals=[G('',[])];});});
  save();closeRestore();rAll();
  alert('Loaded. Download a backup now so this is never lost again.');
}
function restoreFrom(key,mode){
  const raw=localStorage.getItem(key);const d=raw?parseAny(raw):null;
  if(!d){alert('Could not read that saved board.');return;}
  if(mode==='replace'){
    if(!confirm('Replace the current board with this saved version?'))return;
    if(d.work)store.work=d.work;
    if(d.personal)store.personal=d.personal;
    if(d.people)store.people=d.people;
  } else {
    ['work','personal'].forEach(sp=>{
      const src=d[sp];if(!src)return;
      const tgt=store[sp];
      src.cos.forEach(c=>{if(!tgt.cos.find(x=>x.id===c.id||x.name===c.name))tgt.cos.push(c);});
      src.projects.forEach(pr=>{
        const ex=tgt.projects.find(x=>x.id===pr.id||x.name.toLowerCase()===pr.name.toLowerCase());
        if(!ex){tgt.projects.push(pr);return;}
        pr.goals.forEach(g=>{
          const eg=ex.goals.find(x=>(x.title||'').toLowerCase()===(g.title||'').toLowerCase());
          if(!eg){ex.goals.push(g);return;}
          g.steps.forEach(st=>{if(!eg.steps.find(y=>y.t===st.t))eg.steps.push(st);});
        });
        (pr.ideas||[]).forEach(i=>{if(!ex.ideas.includes(i))ex.ideas.push(i);});
        pr.team.forEach(t=>{if(!ex.team.includes(t))ex.team.push(t);});
      });
    });
    if(d.people)d.people.forEach(pp=>{if(!store.people.find(x=>x.id===pp.id))store.people.push(pp);});
  }
  ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];if(!p.goals)p.goals=[G('',[])];});});
  save();closeRestore();rAll();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='command-center-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d.work&&!d.personal){alert('That file does not look like a Command Center backup.');return;}
    if(!confirm('Replace everything with this backup file?'))return;
    if(d.work)store.work=normSpace(d.work)||store.work;
    if(d.personal)store.personal=normSpace(d.personal)||store.personal;
    if(d.people)store.people=d.people;
    ['work','personal'].forEach(sp=>{store[sp].projects.forEach(p=>{if(!p.ideas)p.ideas=[];});});
    save();closeRestore();rAll();
  }catch(err){alert('Could not read that file.');}};
  r.readAsText(f);
}
/* auto-offer restore once if this board is untouched and older data exists */
(function(){
  try{
    if(localStorage.getItem(CURKEY))return;
    if(scanOld().length)setTimeout(openRestore,500);
  }catch(e){}
})();

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeRestore();}});
window.addEventListener('resize',syncFlipHeights);
rAll();
if(SERVER){document.getElementById('fileBtn').style.display='none';pullServer();}else{tryReconnectFile();}
